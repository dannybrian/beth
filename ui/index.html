<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replaced on `hello` with "<director>: <repo>" — the name is the bound
         repo's to supply, so this is only what shows before the stream connects. -->
    <title>beth</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="strip">
      <div class="strip-left">
        <span class="dot" id="status-dot"></span>
        <span id="repo-label">…</span>
        <!-- WHO, not a setting — which is why it sits by the repo rather than
             with the dials on the right. Hidden entirely on a machine with no
             personas, because the bound repo's own DIRECTOR.md is the default
             and always was. -->
        <select id="persona-select" title="Who you are talking to. Switching starts a new conversation." hidden></select>
        <!-- How much of what she writes is read ALOUD, beside WHO is talking —
             the dial belongs to the speaker, not to the settings pile on the
             right. The transcript always has all of it either way. -->
        <select id="speech-select" title="How much of what she writes is spoken aloud — the transcript always has all of it. headings only = the shape of a structured reply; announcements = findings and events. A decision landing in your queue is spoken at every level but silent.">
          <option value="full">speak all</option>
          <option value="brief">say + last ¶</option>
          <option value="headings">headings only</option>
          <option value="headlines">announcements</option>
          <option value="off">silent</option>
        </select>
        <!-- The MACHINE's voice, not this tab's: every harness on this Mac
             shares one mute and one volume (src/voiceRoom.ts), because three
             directors on one desk are one soundscape. Mute gates lines before
             they are announced — nothing plays and nothing is billed. Volume is
             the knob on every speaker at once; zero still plays (and bills),
             just silently — the tooltip says which is which. -->
        <button id="mute-toggle" class="mute" title="Mute every director’s voice on this machine — nothing plays, nothing is billed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6.5 8.5H3v7h3.5L11 19z" />
            <path class="wave" d="M14.5 9.5a4 4 0 0 1 0 5" />
            <path class="wave" d="M17 7a7.5 7.5 0 0 1 0 10" />
            <path class="slash cut" d="M4 4.5 19.5 20" />
            <path class="slash" d="M4 4.5 19.5 20" />
          </svg>
        </button>
        <!-- The end-of-turn bell. Sits with the other audio controls because that
             is what it is; a page preference, so localStorage, not the gear.
             ⚠ The mute beside it does NOT reach this: that one is about her
             voice and about not paying for audio, and the bell is most useful
             precisely when she is silent. -->
        <button id="bell-toggle" class="bell" title="Soft tone when a turn finishes — independent of the voice mute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7" />
            <path d="M13.7 20a2 2 0 0 1-3.4 0" />
            <path class="slash cut" d="M4 4.5 19.5 20" />
            <path class="slash" d="M4 4.5 19.5 20" />
          </svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="100"
               title="Volume — every director on this machine. Zero still bills; the mute is what stops that." />
        <span class="mode" id="mode-label"></span>
      </div>
      <!-- The workbench: THE url being iterated on right now, dead centre in
           the most glanceable strip on the page — where an editor puts the
           document title. Absent entirely when nothing is pinned. She pins it
           (the `workbench` tool); the × is Danny's. In flex flow between the
           clusters so a narrow window squeezes it to ellipsis — absolute
           centring put it ON the dials (see the .bench comment in app.css). -->
      <div class="bench" id="bench" hidden>
        <a id="bench-link" target="_blank" rel="noopener noreferrer" title="What we're working on — opens in a new tab">
          <span class="bench-dot" aria-hidden="true"></span>
          <span id="bench-label"></span>
          <span id="bench-url"></span>
        </a>
        <button id="bench-clear" title="Clear — the work moved on">×</button>
      </div>
      <div class="strip-right">
        <!-- The plan windows, in the strip rather than behind the meter, because
             the five-hour reaching 100% is the exact moment usage credits start
             to drain (creditMeter.ts arms there) — a number worth having already
             seen rather than one you go looking for. Only these two: the
             model-scoped windows are a panel-sized answer. Absent entirely on a
             session with no plan, because an unfillable gauge is worse than
             none; the panel behind them holds everything else. -->
        <button id="usage-meters" class="umeters" hidden>
          <span class="um" id="um-5h"><b>5h</b><span class="sbar"><i></i></span></span>
          <span class="um" id="um-7d"><b>7d</b><span class="sbar"><i></i></span></span>
          <!-- Session context, third and last: the two plan windows are about
               the account and this one is about the conversation, so it reads
               as the near thing after the far ones. Unlike them it is never
               absent — every session has a context, plan or no plan. -->
          <span class="um" id="um-ctx"><b>ctx</b><span class="sbar"><i></i></span></span>
        </button>
        <select id="model-select" title="Model for this conversation — switches live, context is kept">
          <option value="claude-opus-5">Opus 5</option>
          <option value="claude-fable-5">Fable 5</option>
        </select>
        <!-- How hard she thinks. The unset option is labelled with the field name
             rather than "default", so the strip says what the control IS while
             nothing is chosen and says the level once something is. -->
        <select id="effort-select" title="Reasoning effort — switches live. Unset leaves it to the model; the mic ducks it while you are talking.">
          <option value="">effort</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="xhigh">xhigh</option>
          <option value="max">max</option>
        </select>
        <!-- Build it. Unlike the test light beside it this is a TRIGGER: the
             click runs the command, because "quickly kick one off" is the whole
             ask, and a build is the one command that is safe to repeat — it is
             idempotent by definition and a no-op when nothing changed. The panel
             opens with it so you see what happened; while a build is in flight
             the click only opens the panel, so a second press cannot pile on. -->
        <button id="build-light" class="tlight grey" title="Build">
          <svg class="ticon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.2 20.5 12 6 20.8z" /></svg>
        </button>
        <!-- "Is the tree green" — the question asked twenty times a day, which
             the page could not answer until the numbers moved out of here. -->
        <button id="test-light" class="tlight grey" title="Tests">
          <span class="tdot"></span><span id="test-count"></span>
        </button>
        <!-- Settings, and the things that turned out to be settings rather than
             dials: what you change once a week does not earn strip width. -->
        <button id="gear" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.3" />
            <path d="M12 2.7v2.5M12 18.8v2.5M2.7 12h2.5M18.8 12h2.5M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8" />
          </svg>
        </button>
      </div>
    </header>

    <div id="test-panel" class="stats wide" hidden></div>
    <div id="build-panel" class="stats wide" hidden></div>

    <!-- The gear. Two dials that were never worth strip width (you change them
         about once a week) and the two commands the lights run. -->
    <div id="gear-panel" class="stats set" hidden>
      <h3>Permissions</h3>
      <!-- A card cannot be answered by voice, so this is really a control over
           how often a spoken conversation can be stopped dead. Which is why the
           GEAR carries the tell when it is anything but auto: the setting moved
           in here, the fact that it is loose stays visible from the strip. -->
      <select id="perm-select" title="How tool permissions are resolved — switches live">
        <option value="auto">auto</option>
        <option value="default">ask</option>
        <option value="acceptEdits">edits ok</option>
        <option value="dontAsk">no asks</option>
      </select>
      <h3>Commands</h3>
      <div id="gear-commands"></div>
      <div class="snote">Split on whitespace and run directly — no shell, so a pipeline belongs in a script the project has.</div>
    </div>

    <!-- The wire: what actually happened on the API. Opened from the status
         dot, PULLED while open — nothing here rides the stream or the replay,
         so a closed panel costs the page nothing at all. -->
    <div id="wire-panel" class="stats wide wire" hidden></div>

    <!-- The numbers, behind the meter. They answer a question nobody asks
         mid-conversation, so they do not get the top right. -->
    <div id="stats" class="stats" hidden></div>

    <main>
      <section class="transcript" id="transcript"></section>
      <!-- Every section collapses, and Plans is the one that GROWS: the queues
           above it are short but unbounded, and plans must not get pushed off. -->
      <aside class="side">
        <section class="sect" data-sect="pending">
          <h2>
            <span class="caret"></span>Pending <span class="count" id="pending-count"></span>
            <button id="pending-expand" class="scope" title="Open the queue full-size — Escape or a click outside puts it away">open</button>
          </h2>
          <div id="pending-decisions" class="panel"></div>
        </section>
        <section class="sect" data-sect="workers">
          <h2><span class="caret"></span>Workers <span class="count" id="workers-count"></span></h2>
          <div id="pending-workers" class="panel"></div>
        </section>
        <section class="sect" data-sect="events">
          <h2><span class="caret"></span>Events</h2>
          <div id="event-feed" class="panel capped"></div>
        </section>
        <section class="sect grow" data-sect="plans">
          <h2>
            <span class="caret"></span>Plans <span id="work-count" class="count"></span>
            <button id="work-scope" class="scope" title="The panel shows work in flight. Show every plan, including shipped and parked.">show all</button>
          </h2>
          <div id="work-panel" class="panel work"></div>
        </section>
      </aside>
    </main>

    <footer class="composer">
      <!-- What Danny is pointing at. Each chip carries a spoken name he can read
           and a path Beth can resolve — the pair is the whole point. -->
      <div id="composer-refs" class="refs" hidden></div>
      <div class="composer-row">
        <!-- Inline SVG rather than the 🎙 emoji: the emoji renders as a chunky
             colour glyph that ignores the button's state colour entirely. -->
        <button id="voice-toggle" class="voice off" title="Voice off  (keypad 0)">
          <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="11" rx="3" />
            <path d="M5 10.5v1a7 7 0 0 0 14 0v-1" />
            <path d="M12 18.5V21" />
          </svg>
          <svg class="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3.8 1.8 20.2h20.4z" />
            <path d="M12 9.5v5" />
            <path d="M12 17.6v.01" />
          </svg>
        </button>
        <!-- Whether a settled utterance SENDS itself or just lands in the box.
             It sits between the mic and the field because that is the order of
             the thing it governs: heard here, held there. -->
        <button id="autosend-toggle" class="autosend on" title="Speech sends itself once you stop talking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.3 2.7 2.9 9.7l7.6 3.8 3.8 7.6z" />
            <path d="M21.3 2.7 10.5 13.5" />
            <!-- ACROSS the plane, not along it: the plane's own body runs
                 bottom-left to top-right, so a slash the same way reads as part
                 of the drawing rather than a line through it. -->
            <path class="slash cut" d="M3.5 3.5 20.5 20.5" />
            <path class="slash" d="M3.5 3.5 20.5 20.5" />
          </svg>
        </button>
        <textarea id="input" rows="1" placeholder="Talk to the director…" autofocus></textarea>
        <!-- Visible only while something is actually running for her. A turn with
             no outward sign is indistinguishable from a hang — which is the same
             reason she narrates before a long operation. -->
        <div id="progress" class="progress" hidden>
          <span id="progress-spin" class="spin" aria-hidden="true"></span>
          <span id="progress-time" class="t">0:00</span>
          <span id="progress-note" class="note"></span>
        </div>
        <!-- The context meter is a GAUGE, not an activity light, so it does not
             come and go with the work. Clicking it is where the numbers live. -->
        <button id="ctx-meter" class="ctx" title="Context used — click for the numbers"><i></i></button>
        <!-- The only button left in the row. Enter sends, `/clear` clears, and
             what this is FOR is the thing neither of those covers: throwing away
             a bad transcription before it becomes a turn. Small on purpose — it
             is an escape hatch, not the primary action. -->
        <button id="interrupt" class="ghost" title="Escape — drop what is in the box and stop the in-flight turn. The conversation continues.">Stop</button>
      </div>
    </footer>

    <!-- The lightbox and the queue overlay — the stats panel's species writ
         large: bigger GLANCES, not dialogs. A click off the content dismisses,
         Escape dismisses, nothing steals focus. Opened by Beth's `show` tool,
         by clicking a figure, or by the "open" button on Pending. -->
    <div id="lightbox" class="shade" hidden>
      <figure><img alt="" /><figcaption></figcaption></figure>
    </div>
    <!-- Reading a plan without leaving the room. Read-only by construction: the
         harness does not write plan files, so the checkboxes in here are
         disabled and the body is never editable. The header carries the same
         four controls the panel row does, because this is where you are when
         you decide to act on one. -->
    <div id="plan-overlay" class="shade" hidden>
      <div class="sheet plan-sheet">
        <div class="plan-head">
          <div class="plan-titles">
            <div id="plan-title"></div>
            <div id="plan-path"></div>
          </div>
          <div id="plan-actions"></div>
          <button id="plan-close" title="Close (Esc)">×</button>
        </div>
        <div id="plan-body" class="md"></div>
      </div>
    </div>
    <div id="pending-overlay" class="shade" hidden>
      <div class="sheet" id="pending-sheet"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
